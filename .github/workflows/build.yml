name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore tests\SmokeTests\SmokeTests.Net10.csproj --configfile NuGet.Net10.Config

      - name: Run smoke tests
        run: dotnet run --configuration Release --project tests\SmokeTests\SmokeTests.Net10.csproj --no-restore
